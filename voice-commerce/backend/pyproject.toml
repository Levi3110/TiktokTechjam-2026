[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-commerce-backend"
version = "0.1.0"
description = "Voice shopping supervisor with hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<1",
  "rank-bm25>=0.2.2,<1",
  "python-dotenv>=1.0,<2",
  "openai>=1.70,<3",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.1,<2",
  "sentence-transformers>=3.4,<6",
  "faiss-cpu>=1.10,<2",
  "pymongo>=4.11,<5",
]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
